<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc">
  <title id="title">AWS Three-Tier Architecture with Terraform</title>
  <desc id="desc">An AWS VPC with public Application Load Balancer subnets, private frontend and backend EC2 tiers, and a private RDS MySQL database across two Availability Zones.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#1c2940"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 z" fill="#d6e2f0"/></marker>
    <style>
      .h1{font:700 30px Arial,sans-serif;fill:#f8fafc}.sub{font:16px Arial,sans-serif;fill:#cbd5e1}.zone{font:700 18px Arial,sans-serif;fill:#e2e8f0}.boxhead{font:700 19px Arial,sans-serif;fill:#f8fafc}.txt{font:15px Arial,sans-serif;fill:#e2e8f0}.small{font:13px Arial,sans-serif;fill:#cbd5e1}.line{stroke:#d6e2f0;stroke-width:3;fill:none;marker-end:url(#arrow)}.vpc{fill:#18263a;stroke:#7b91ae;stroke-width:2.5;stroke-dasharray:10 7}.public{fill:#28394d;stroke:#4f9ce8;stroke-width:2}.front{fill:#28394d;stroke:#47b881;stroke-width:2}.back{fill:#28394d;stroke:#d2a14a;stroke-width:2}.db{fill:#28394d;stroke:#c084fc;stroke-width:2}.alb{fill:#245078;stroke:#71b7ff;stroke-width:2}.ec2{fill:#1e473e;stroke:#61c79b;stroke-width:2}.rds{fill:#49315e;stroke:#d1a4ff;stroke-width:2}.pill{fill:#0f172a;stroke:#64748b;stroke-width:1.3}
    </style>
  </defs>
  <rect width="1400" height="930" rx="20" fill="url(#bg)"/>
  <text x="700" y="54" text-anchor="middle" class="h1">AWS Three-Tier Architecture</text>
  <text x="700" y="83" text-anchor="middle" class="sub">Provisioned with Terraform · Region: ap-south-1 (Mumbai)</text>

  <rect x="570" y="112" width="260" height="70" rx="14" class="pill"/>
  <text x="700" y="142" text-anchor="middle" class="boxhead">Internet / Users</text>
  <text x="700" y="165" text-anchor="middle" class="small">HTTP :80</text>

  <rect x="70" y="220" width="1260" height="660" rx="22" class="vpc"/>
  <text x="95" y="252" class="boxhead">Amazon VPC · 10.0.0.0/16</text>
  <text x="1290" y="252" text-anchor="end" class="small">Internet Gateway attached · public route 0.0.0.0/0</text>

  <rect x="100" y="280" width="1200" height="148" rx="16" class="public"/>
  <text x="125" y="311" class="zone">Public load-balancer subnets</text>
  <rect x="450" y="330" width="500" height="76" rx="13" class="alb"/>
  <text x="700" y="359" text-anchor="middle" class="boxhead">Application Load Balancer</text>
  <text x="700" y="383" text-anchor="middle" class="txt">three-tier-alb · HTTP listener :80</text>
  <text x="130" y="352" class="txt">AZ ap-south-1a</text>
  <text x="130" y="377" class="small">10.0.1.0/24</text>
  <text x="1100" y="352" class="txt">AZ ap-south-1b</text>
  <text x="1100" y="377" class="small">10.0.2.0/24</text>
  <path d="M700 182 L700 325" class="line"/>

  <rect x="100" y="455" width="1200" height="150" rx="16" class="front"/>
  <text x="125" y="486" class="zone">Frontend tier · private subnets</text>
  <rect x="210" y="512" width="390" height="72" rx="12" class="ec2"/>
  <text x="405" y="541" text-anchor="middle" class="boxhead">Frontend EC2 · NGINX</text>
  <text x="405" y="564" text-anchor="middle" class="small">10.0.11.0/24 · AZ ap-south-1a</text>
  <rect x="800" y="512" width="390" height="72" rx="12" class="ec2"/>
  <text x="995" y="541" text-anchor="middle" class="boxhead">Frontend EC2 · NGINX</text>
  <text x="995" y="564" text-anchor="middle" class="small">10.0.12.0/24 · AZ ap-south-1b</text>
  <path d="M600 407 L405 506" class="line"/>
  <path d="M800 407 L995 506" class="line"/>

  <rect x="100" y="630" width="1200" height="112" rx="16" class="back"/>
  <text x="125" y="660" class="zone">Backend tier · private subnets</text>
  <rect x="210" y="679" width="390" height="48" rx="10" class="ec2"/>
  <text x="405" y="709" text-anchor="middle" class="txt">Backend EC2 1 · 10.0.21.0/24</text>
  <rect x="800" y="679" width="390" height="48" rx="10" class="ec2"/>
  <text x="995" y="709" text-anchor="middle" class="txt">Backend EC2 2 · 10.0.22.0/24</text>
  <path d="M405 584 L405 673" class="line"/>
  <path d="M995 584 L995 673" class="line"/>

  <rect x="100" y="765" width="1200" height="90" rx="16" class="db"/>
  <text x="125" y="795" class="zone">Database tier · private DB subnets</text>
  <rect x="430" y="801" width="540" height="42" rx="10" class="rds"/>
  <text x="700" y="827" text-anchor="middle" class="txt">Amazon RDS for MySQL 8.0 · not publicly accessible</text>
  <path d="M405 727 L560 797" class="line"/>
  <path d="M995 727 L840 797" class="line"/>

  <text x="700" y="907" text-anchor="middle" class="small">Security groups: Internet → ALB :80; ALB → frontend :80; frontend → backend :8080; backend → MySQL :3306</text>
</svg>
